<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172120"><meta name="mobile-web-app-capable" content="yes"><meta name="application-name" content="Kalendarz Specjalisty"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Kalendarz Specjalisty</title><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<style>
/* Układ: terminarz w kratkę. Arkusz kalendarza leży na chłodnym papierze, oś dnia wyznaczają dzwonki (pasy lekcji 1–8),
   dni bez zajęć są kreskowane, święta czerwone jak w ściennym kalendarzu, kolor „atramentu” prowadzi akcje. */
:root{
  --bg:#F1F4F7;
  --kratka:rgba(36,67,176,.05);
  --surface:#FFFFFF;
  --sunken:#EEF2F6;
  --band:rgba(36,67,176,.055);
  --line:#E0E6ED;
  --line-strong:#C5CFDA;
  --ink:#17202B;
  --ink-2:#475569;
  --ink-3:#717F93;
  --accent:#2443B0;
  --accent-hover:#1B358F;
  --on-accent:#FFFFFF;
  --accent-soft:#E7ECFA;
  --pen:#C8372E;
  --pen-soft:#FBEAE8;
  --on-pen:#FFFFFF;
  --warn:#955400;
  --warn-soft:#FDF2DE;
  --ok:#25704A;
  --ok-soft:#E1F2E7;
  --hatch:rgba(23,32,43,.075);
  --shadow:0 1px 2px rgba(23,32,43,.06),0 12px 32px rgba(23,32,43,.12);
  --tint:12%;
  --tint-line:34%;
  --tint-ink:74%;
  --t-kons:#3D5BD9;
  --t-naucz:#B5730F;
  --t-rodz:#0F8C80;
  --t-inst:#8246C8;
  --t-warszt:#3F8F3A;
  --t-konf:#5E6E80;
  --t-staz:#9A6B2F;
  --t-rewal:#147D92;
  --t-terap:#C05A86;
  --t-kryz:#D0362C;
  --t-diag:#8246C8;
  --t-grupa:#3F8F3A;
  --t-zesp:#5E6E80;
  --t-inne:#8A5A35;
  --f-display:Georgia,"Times New Roman",serif;
  --f-ui:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --f-mono:Consolas,"Courier New",ui-monospace,monospace;
  --r:6px;
  --r-lg:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111817;--kratka:rgba(147,169,255,.04);--surface:#172120;--sunken:#1E2927;--band:rgba(147,169,255,.065);
    --line:#283432;--line-strong:#3B4947;--ink:#E3EAE7;--ink-2:#AFBCB8;--ink-3:#84928E;
    --accent:#93A9FF;--accent-hover:#ADBDFF;--on-accent:#0D1430;--accent-soft:#222D4C;
    --pen:#FF7D6E;--pen-soft:#3A2321;--on-pen:#2A0D0A;--warn:#F2B04E;--warn-soft:#3A2D16;--ok:#7FD39B;--ok-soft:#1C3527;
    --hatch:rgba(227,234,231,.065);--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.45);
    --tint:20%;--tint-line:44%;--tint-ink:82%;
    --t-kons:#8EA2FF;--t-naucz:#F0B357;--t-rodz:#4FD1C2;--t-inst:#C49BFF;--t-warszt:#84CF7E;--t-konf:#A3B1C2;--t-staz:#D8B06A;--t-rewal:#62C7DA;--t-terap:#F19AC2;--t-kryz:#FF8A7E;--t-diag:#C49BFF;--t-grupa:#84CF7E;--t-zesp:#A3B1C2;--t-inne:#D19E78;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111817;--kratka:rgba(147,169,255,.04);--surface:#172120;--sunken:#1E2927;--band:rgba(147,169,255,.065);
  --line:#283432;--line-strong:#3B4947;--ink:#E3EAE7;--ink-2:#AFBCB8;--ink-3:#84928E;
  --accent:#93A9FF;--accent-hover:#ADBDFF;--on-accent:#0D1430;--accent-soft:#222D4C;
  --pen:#FF7D6E;--pen-soft:#3A2321;--on-pen:#2A0D0A;--warn:#F2B04E;--warn-soft:#3A2D16;--ok:#7FD39B;--ok-soft:#1C3527;
  --hatch:rgba(227,234,231,.065);--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.45);
  --tint:20%;--tint-line:44%;--tint-ink:82%;
  --t-kons:#8EA2FF;--t-naucz:#F0B357;--t-rodz:#4FD1C2;--t-inst:#C49BFF;--t-warszt:#84CF7E;--t-konf:#A3B1C2;--t-rewal:#62C7DA;--t-terap:#F19AC2;--t-kryz:#FF8A7E;--t-diag:#C49BFF;--t-grupa:#84CF7E;--t-zesp:#A3B1C2;--t-inne:#D19E78;
  color-scheme:dark;
}

/* ---------- podstawy ---------- */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--f-ui);
  background-image:linear-gradient(var(--kratka) 1px,transparent 1px),linear-gradient(90deg,var(--kratka) 1px,transparent 1px);
  background-size:24px 24px;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.ic{width:18px;height:18px;flex:none}
span[data-i]{display:inline-grid;place-items:center}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.grow{flex:1 1 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{max-width:1640px;margin:0 auto;padding-inline:clamp(16px,2.4vw,32px);padding-block:0 40px}

/* ---------- nagłówek ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px;border-bottom:1px solid var(--line);background:var(--bg)}
@media (min-width:761px){.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30}}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand-name{font-weight:700;font-size:14px;letter-spacing:.005em;white-space:nowrap}
.brand-year{font:600 11px/1.3 var(--f-mono);color:var(--ink-3);letter-spacing:.04em;white-space:nowrap}
.nav{display:flex;align-items:center;gap:4px;min-width:0;flex:1 1 320px}
.period{margin:0 0 0 10px;font:600 clamp(20px,2.3vw,28px)/1.15 var(--f-display);letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.period .yr{color:var(--ink-3);font-weight:500}
.pt-short{display:none}
.views{display:flex}
.tools{display:flex;align-items:center;gap:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s}
.btn:hover:not(:disabled){background:var(--sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover:not(:disabled){background:var(--surface);border-color:var(--line)}
.btn.danger{color:var(--pen)}
.btn.danger.solid{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;padding:0;border-radius:var(--r);border:1px solid transparent;background:transparent;color:var(--ink-2);transition:background-color .15s,color .15s}
.icon-btn:hover{background:var(--surface);border-color:var(--line);color:var(--ink)}
.icon-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.seg{display:inline-flex;padding:3px;gap:2px;background:var(--sunken);border:1px solid var(--line);border-radius:8px}
.seg button{height:30px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);font-weight:600;font-size:13px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.08)}
.seg-fill{display:flex;width:100%;flex-wrap:wrap}
.seg-fill label{flex:1 1 0;position:relative;min-width:0}
.seg-fill input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg-fill span{display:grid;place-items:center;min-height:32px;padding:4px 8px;border-radius:6px;font-weight:600;font-size:12.5px;line-height:1.2;color:var(--ink-2);text-align:center}
.seg-fill input:checked + span{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.08)}
.seg-fill input:focus-visible + span{outline:2px solid var(--accent);outline-offset:1px}

.fab{display:none}
@media (max-width:760px){
  .top{gap:8px 8px}
  .brand{order:1;flex:1 1 auto}
  .tools{order:2}
  .nav{order:3;flex:1 1 100%}
  .views{order:4;flex:1 1 100%}
  .views .seg{width:100%}
  .views .seg button{flex:1;padding:0 6px}
  .period{margin-left:6px;font-size:20px}
  .pt-long{display:none}
  .pt-short{display:inline}
  .hide-sm{display:none}
  .app{padding-block:0 104px}
  .tools .new-btn{display:none}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:16px;border:0;background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow);z-index:40}
  .fab .ic{width:24px;height:24px}
}

.notice{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);border:1px solid var(--line);font-size:13.5px;line-height:1.5}
.notice .ic{color:var(--warn);margin-top:1px}

/* ---------- układ główny ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start;padding-block:16px 0}
@media (max-width:1080px){.layout{grid-template-columns:minmax(0,1fr)}}
.sheet,.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);min-width:0}
.sheet{overflow:hidden}
.sheet-foot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px}
.sheet-foot .ic{width:16px;height:16px}

/* ---------- etykiety dni ---------- */
.tag{display:block;font-size:11px;line-height:1.3;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tag.hol{color:var(--pen);font-weight:600}
.tag.off,.tag.brk{color:var(--ink-2);font-weight:600}
.tag.exam{font-family:var(--f-mono);color:var(--accent);font-weight:600}
.tag.obs{color:var(--ink-3);font-style:italic}
.hatched{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 8px)}

/* ---------- widok miesiąca ---------- */
.mv{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));margin:0 -1px -1px 0}
.mv-h{padding:9px 10px 8px;font:700 11px/1 var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.mv-h.red{color:var(--pen)}
.mc{position:relative;display:flex;flex-direction:column;gap:2px;min-width:0;min-height:120px;padding:6px 6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer}
.mc:hover{background-color:color-mix(in oklab,var(--accent) 3%,var(--surface))}
.mc.out{background-color:var(--sunken)}
.mc.out .mc-num{color:var(--ink-3)}
.mc.off{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 8px)}
.mc.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.mc-top{display:flex;align-items:flex-start;gap:6px;min-width:0}
.mc-num{flex:none;display:grid;place-items:center;min-width:28px;height:28px;padding:0 5px;border:0;border-radius:14px;background:transparent;font:600 13.5px/1 var(--f-mono);color:var(--ink)}
.mc-num:hover{background:var(--sunken)}
.mc-num.red{color:var(--pen)}
.mc-num.today{background:var(--accent);color:var(--on-accent)}
.mc-tags{display:flex;flex-direction:column;gap:1px;min-width:0;padding-top:6px}
.mc-list{display:flex;flex-direction:column;gap:1px;min-width:0}
.mc-ev{display:flex;align-items:center;gap:5px;width:100%;min-width:0;padding:3px 4px;border:0;border-radius:4px;background:transparent;text-align:left;font-size:12.5px;line-height:1.25;color:var(--ink)}
.mc-ev:hover{background:color-mix(in oklab,var(--tc) var(--tint),var(--surface))}
.mc-ev .dot{flex:none;width:8px;height:8px;border-radius:2px;background:var(--tc)}
.mc-ev .t{flex:none;font:500 11.5px/1 var(--f-mono);color:var(--ink-2)}
.mc-ev .l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-ev .ic{width:13px;height:13px;color:var(--ok)}
.mc-ev .nb{flex:none;font:600 10.5px/1 var(--f-mono);color:var(--warn)}
.mc-ev.s-cancel .l{text-decoration:line-through;color:var(--ink-3)}
.mc-ev.s-cancel .dot{opacity:.45}
.mc-more{align-self:flex-start;padding:2px 4px;border:0;border-radius:4px;background:transparent;font-size:12px;font-weight:700;color:var(--accent)}
.mc-dots{display:none}
@media (max-width:640px){
  .mc{min-height:62px;padding:3px 2px 5px;align-items:center}
  .mc-top{justify-content:center}
  .mc-num{min-width:26px;height:26px;font-size:12.5px}
  .mc-list,.mc-tags{display:none}
  .mc-dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:100%}
  .mc-dots i{width:6px;height:6px;border-radius:2px;background:var(--tc)}
  .mv-h{padding:8px 0;text-align:center;letter-spacing:.04em}
}

/* ---------- widok tygodnia i dnia ---------- */
.wk-scroll{overflow-x:auto}
.wk{--gut:62px;--colmin:96px;min-width:calc(var(--gut) + var(--days) * var(--colmin))}
@media (max-width:640px){.wk{--gut:56px;--colmin:56px}}
.wk-row{display:grid;grid-template-columns:var(--gut) repeat(var(--days),minmax(0,1fr))}
.wk-head{border-bottom:1px solid var(--line)}
.wk-corner{display:flex;align-items:flex-end;justify-content:flex-end;padding:4px 8px;font-size:10.5px;color:var(--ink-3)}
.wk-day{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;padding:9px 4px 8px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--ink)}
.wk-day .wd{font:700 11px/1 var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.wk-day .dn{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 4px;border-radius:15px;font:600 15px/1 var(--f-mono)}
.wk-day .mn{font-size:13px;color:var(--ink-2)}
.wk-day.red .dn,.wk-day.red .wd{color:var(--pen)}
.wk-day.today .dn{background:var(--accent);color:var(--on-accent)}
.wk-day.sel{box-shadow:inset 0 -2px 0 var(--accent)}
.wk-all{border-bottom:1px solid var(--line);min-height:28px}
.wk-allcell{display:flex;flex-direction:column;gap:1px;min-width:0;padding:5px 7px;border-left:1px solid var(--line)}
.wk-body{position:relative}
.wk-gutter{grid-column:1;grid-row:1;position:relative}
.wk-hl{position:absolute;left:6px;transform:translateY(-50%);font:500 11px/1 var(--f-mono);color:var(--ink-3);white-space:nowrap}
.wk-ln{position:absolute;right:6px;transform:translateY(-50%);min-width:20px;text-align:center;font:600 17px/1 var(--f-display);color:var(--accent);opacity:.8}
.wk-grid{grid-column:2 / -1;grid-row:1;position:relative;pointer-events:none}
.wk-band{position:absolute;left:0;right:0;background:var(--band)}
.wk-hour{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.wk-col{grid-row:1;position:relative;min-width:0;border-left:1px solid var(--line);cursor:copy}
.work-window{position:absolute;left:3px;right:3px;z-index:0;border:1px dashed color-mix(in oklab,var(--accent) 42%,var(--line));border-radius:5px;background:color-mix(in oklab,var(--accent) 5%,transparent);pointer-events:none}
.work-window span{position:absolute;right:4px;top:3px;padding:1px 4px;border-radius:3px;background:color-mix(in oklab,var(--surface) 84%,transparent);color:var(--accent);font:600 9.5px/1.2 var(--f-mono);white-space:nowrap}
.wk-worktime{font:600 10px/1 var(--f-mono);color:var(--accent);white-space:nowrap}
.wk-col.off{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 8px)}
.wk-col.sel{background-color:color-mix(in oklab,var(--accent) 3.5%,transparent)}
@media (max-width:640px){
  .wk-hl{left:3px;font-size:10px}
  .wk-ln{right:3px;font-size:15px;min-width:14px}
  .wk-day{flex-direction:column;gap:2px;padding:6px 2px}
  .wk-day .wd{font-size:10px;letter-spacing:.04em}
  .wk-day .dn{min-width:26px;height:26px;font-size:13.5px}
  .wk-corner span{display:none}
  .wk-allcell{padding:3px 4px}
}
.wk1 .wk-day{justify-content:flex-start;padding-left:14px;flex-direction:row}

.ev{position:absolute;display:flex;flex-direction:column;gap:1px;min-width:0;padding:3px 6px;overflow:hidden;
  border-radius:4px;border:1px solid var(--line-strong);background:var(--sunken);color:var(--ink);
  border-color:color-mix(in oklab,var(--tc) var(--tint-line),var(--surface));
  background:color-mix(in oklab,var(--tc) var(--tint),var(--surface));
  color:color-mix(in oklab,var(--tc) var(--tint-ink),var(--ink));
  text-align:left;font-size:12.5px;line-height:1.25;z-index:2}
.ev:hover{z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.ev-t{display:flex;align-items:center;gap:5px;font:500 11px/1.25 var(--f-mono);white-space:nowrap}
.ev-t b{font-weight:600;opacity:.8}
.ev-l{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.ev-s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9}
.ev-n{font-size:12px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.ev.compact{flex-direction:row;align-items:center;gap:6px;padding-block:1px}
.ev.compact .ev-l{min-width:0}
.ev .st{margin-left:auto;display:inline-grid;place-items:center;min-width:18px;height:16px;padding:0 3px;border-radius:3px;background:var(--surface);font:600 10px/1 var(--f-mono);color:var(--ink-2)}
.ev .st .ic{width:12px;height:12px;color:var(--ok)}
.ev .st.todo{color:var(--warn)}
.ev.s-cancel{opacity:.6;background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 6px)}
.ev.s-cancel .ev-l{text-decoration:line-through}
.ev.s-absent{border-style:dashed}
.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--accent);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}

/* ---------- widok listy ---------- */
.lv-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.lv-search{flex:1 1 220px;display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);min-width:0;color:var(--ink-3)}

  const out = [];
  for (let i = 0; i < nums.length;) {
    let j = i;
    while (j + 1 < nums.length && nums[j + 1] === nums[j] + 1) j++;

function makeCloudStore(db, uid) {
  const base = db.doc(`data/users/${uid}/cal`);
  const M = base.collection('meetings'), ST = base.collection('students');
  const toMap = snap => new Map(snap.docs.map(d => [d.id, d.data()]));
  return {
    kind: 'cloud',
    watchMeetings: (from, to, cb, err) => M.where('date', '>=', from).where('date', '<=', to).orderBy('date').limit(1000).onSnapshot(s => cb(toMap(s)), err),
    watchStudentMeetings: (sid, cb, err) => M.where('studentId', '==', sid).limit(1000).onSnapshot(s => cb(toMap(s)), err),
    watchStudents: (cb, err) => ST.limit(1000).onSnapshot(s => cb(toMap(s)), err),
    watchSettings: (cb, err) => base.onSnapshot(s => cb(s.exists ? s.data() : null), err),
    setMeeting: (id, d) => retry(() => M.doc(id).set(d)),
    updateMeeting: (id, p) => retry(() => M.doc(id).update(p)),
    deleteMeeting: id => retry(() => M.doc(id).delete()),

    deleteStudent: id => retry(() => ST.doc(id).delete()),

    async queryMeetings(field, value) { const s = await retry(() => M.where(field, '==', value).limit(1000).get()); return s.docs.map(d => [d.id, d.data()]); },
    async allMeetings() {
      const out = new Map();
      let cursor = '0000-00-00';
      for (let i = 0; i < 40; i++) {
        const s = await retry(() => M.where('date', '>=', cursor).orderBy('date').limit(1000).get());
        let last = cursor;

        if (s.size < 1000 || last === cursor) break;

      }

    },
    async allStudents() { const s = await retry(() => ST.limit(1000).get()); return s.docs.map(d => [d.id, d.data()]); },
  };

    { name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' },
    raw,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']

async function encryptVaultObject(data, key = vaultKey, salt = vaultSalt) {

  const plain = new TextEncoder().encode(JSON.stringify(data));
  const enc = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plain);
  return JSON.stringify({
    app: 'kalendarz-specjalisty-encrypted',
    v: 1,
    kdf: 'PBKDF2-SHA256',
    iterations: 310000,
    cipher: 'AES-256-GCM',
    salt: b64(salt),
    iv: b64(iv),
    data: b64(new Uint8Array(enc))

async function decryptVaultEnvelope(raw, password) {

  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: unb64(env.iv) },
    key,
    unb64(env.data)
  );
  const data = JSON.parse(new TextDecoder().decode(plain));
  return { data, key, salt };
}

  let saveQueue = Promise.resolve();
  const save = () => {
    saveQueue = saveQueue.then(() => persistVault(data));

  };
  const emit = () => { clearTimeout(timer); timer = setTimeout(() => subs.forEach(fn => fn()), 0); };

              const old = JSON.parse(legacy);
              if (old && typeof old === 'object') initial = { ...initial, ...old };
            } catch {}
          }
          const veryOld = localStorage.getItem('tme_psycholog_calendar_v1');
          if (veryOld && !Object.keys(initial.meetings || {}).length) {
            try {
              const arr = JSON.parse(veryOld);
              if (Array.isArray(arr)) {
                const conv = convertOldEvents(arr);
                initial.students = Object.fromEntries(conv.students);
                initial.meetings = Object.fromEntries(conv.meetings);
              }
            } catch {}
          }
          await persistVault(initial);
          localStorage.removeItem(LEGACY_DATA_KEY);
          vaultData = initial;
        } else {
          const dec = await decryptVaultEnvelope(raw, pwd);
          vaultPassword = pwd; vaultKey = dec.key; vaultSalt = dec.salt; vaultData = dec.data;
        }
        screen.hidden = true;
        resolve(vaultData);
      } catch (e) {
        console.warn(e);
        err.textContent = creating ? 'Nie udało się utworzyć sejfu.' : 'Nieprawidłowe hasło albo uszkodzone dane.';
        busy = false; btn.disabled = false; btn.textContent = creating ? 'Utwórz i otwórz' : 'Odblokuj';
      }
    };
    btn.addEventListener('click', run);
    helloBtn.onclick = () => unlockWithWindowsHello(resolve);
    pass.addEventListener('keydown', e => { if (e.key === 'Enter' && !creating) run(); });
    pass2.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
    setTimeout(() => pass.focus(), 80);
  });
}

let settingsQueue = Promise.resolve();
function saveSettings(s) {
  const body = serializeSettings(s);
  const p = settingsQueue.then(() => store.setSettings(body));
  settingsQueue = p.catch(() => {});
  return p;
}

async function runLimited(tasks, n) {
  let i = 0;
  const worker = async () => { while (i < tasks.length) { const t = tasks[i++]; await t(); } };
  await Promise.all(Array.from({ length: Math.min(n, tasks.length) }, worker));
}

function handleWriteError(e) {
  const code = e && e.code;
  const msg = code === 'invalid_argument' ? 'Nie udało się zapisać — brak uprawnień do zapisu w tym kalendarzu.'
    : code === 'quota_exceeded' ? 'Zabrakło miejsca na nowe wpisy. Zrób kopię zapasową i usuń stare spotkania.'
    : code === 'resource_exhausted' ? 'Za dużo zmian naraz. Spróbuj ponownie za chwilę.'
    : code === 'revoked' ? 'Dostęp do zapisu został cofnięty.'
    : 'Nie udało się zapisać. Sprawdź połączenie i spróbuj ponownie.';
  if (code === 'invalid_argument' || code === 'revoked') S.readOnly = true;
  toast(msg, 'err');
  console.warn(e);
}
function onDbError(e) {
  console.warn(e);
  if (e && e.code === 'revoked') { S.readOnly = true; toast('Dostęp do danych został cofnięty.', 'err'); }
  else if (e && e.code === 'unavailable') setTimeout(() => { winKey = null; ensureWindow(); }, 2000);
}

let unsubMeetings = null, winKey = null;
function ensureWindow() {
  if (!store) return;
  const Y = schoolYearOf(S.cursor);
  if (winKey === Y && unsubMeetings) return;
  if (unsubMeetings) unsubMeetings();
  winKey = Y;
  const from = addDays(`${Y}-09-01`, -45), to = addDays(`${Y + 1}-08-31`, 45);
  S.loaded.meetings = false;
  unsubMeetings = store.watchMeetings(from, to, map => {
    S.meetings = map; S.loaded.meetings = true; S.capped = map.size >= 1000;
    render();
    if (dlgS.open) refreshStudentsDialog();
  }, onDbError);
}

// ── dane pochodne ──
function groupByDate() {
  const g = new Map();
  for (const [id, m] of S.meetings) {
    if (!m || !DATE_RE.test(m.date) || !TIME_RE.test(m.start) || !TIME_RE.test(m.end)) continue;
    const st = STATUS_LABEL[m.status] ? m.status : 'plan';
    if (!g.has(m.date)) g.set(m.date, []);
    g.get(m.date).push({ ...m, id, status: st });
  }
  for (const arr of g.values()) arr.sort((a, b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end));
  return g;
}
const allItems = () => [...BY.values()].flat();
const studentOf = m => (m.studentId ? S.students.get(m.studentId) : null);
function initials(name) {
  const s = String(name || '').trim();
  if (!s) return '';
  if (/\d/.test(s)) return s;
  return s.split(/\s+/).slice(0, 3).map(w => w.charAt(0).toUpperCase() + '.').join('');
}
const whoLabel = m => { const st = studentOf(m); return st ? (S.discreet ? initials(st.name) : st.name) : ''; };
const titleOf = m => (S.discreet ? '' : String(m.title || '').trim());
function evLabel(m) {
  const who = whoLabel(m), what = titleOf(m);
  if (who && what) return `${who} · ${what}`;
  return who || what || TYPE_OF(m).short;
}
const lessonNo = m => S.settings.bells.findIndex(([a, b]) => a === m.start && b === m.end) + 1;
const isPast = m => m.date < today() || (m.date === today() && toMin(m.end) <= nowMin());
const isTodo = m => m.status === 'plan' && isPast(m);
function showWeekends(from, to) {
  if (S.settings.weekend) return true;
  for (const [d, arr] of BY) if (d >= from && d <= to && dow(d) >= 5 && arr.length) return true;
  return false;
}
function weekDays() {
  const mon = mondayOf(S.cursor);
  const n = showWeekends(mon, addDays(mon, 6)) ? 7 : 5;
  return Array.from({ length: n }, (_, i) => addDays(mon, i));
}
function dayTags(d) {
  const t = [];
  if (d.hol) t.push({ k: 'hol', t: d.hol });
  if (d.off != null) t.push({ k: 'off', t: d.off });
  if (d.brk) t.push({ k: 'brk', t: d.brk });
  if (d.exam) t.push({ k: 'exam', t: d.exam });
  if (d.obs) t.push({ k: 'obs', t: d.obs });
  return t;
}


const undoStack = [];
function updateUndoButton() {
  const b=$('#undoBtn');
  if (!b) return;
  b.disabled = !undoStack.length;
  b.title = undoStack.length ? `Cofnij: ${undoStack[undoStack.length-1].label}` : 'Brak operacji do cofnięcia';
}
function pushUndo(label, fn) {

  if (undoStack.length > 20) undoStack.shift();

async function undoLast() {

function periodTitle() {
  const d = parse(S.cursor);
  if (S.view === 'month' || (S.view === 'list' && S.listRange === 'month')) return `${cap(MONTHS[d.getMonth()])} <span class="yr">${d.getFullYear()}</span>`;
  if (S.view === 'list') return `Rok szkolny <span class="yr">${syLabel(schoolYearOf(S.cursor))}</span>`;
  const both = (long, short) => `<span class="pt-long">${long}</span><span class="pt-short">${short}</span>`;
  if (S.view === 'day') {
    const tail = `${d.getDate()} ${MONTHS_GEN[d.getMonth()]} <span class="yr">${d.getFullYear()}</span>`;
    return both(`${cap(DAYS[dow(S.cursor)])}, ${tail}`, tail);
  }
  const days = weekDays(), a = parse(days[0]), b = parse(days[days.length - 1]);
  const yr = `<span class="yr">${b.getFullYear()}</span>`;
  if (a.getMonth() === b.getMonth()) return `${a.getDate()}–${b.getDate()} ${MONTHS_GEN[b.getMonth()]} ${yr}`;
  const short = `${a.getDate()}.${pad(a.getMonth() + 1)}–${b.getDate()}.${pad(b.getMonth() + 1)} ${yr}`;
  if (a.getFullYear() === b.getFullYear()) return both(`${a.getDate()} ${MONTHS_GEN[a.getMonth()]} – ${b.getDate()} ${MONTHS_GEN[b.getMonth()]} ${yr}`, short);
  return both(`${a.getDate()} ${MONTHS_GEN[a.getMonth()]} ${a.getFullYear()} – ${b.getDate()} ${MONTHS_GEN[b.getMonth()]} ${yr}`, short);
}

function renderMonth() {
  const c = parse(S.cursor), y = c.getFullYear(), mo = c.getMonth();
  const first = iso(new Date(y, mo, 1, 12)), last = iso(new Date(y, mo + 1, 0, 12));
  const start = mondayOf(first), end = addDays(mondayOf(last), 6);
  const we = showWeekends(start, end), cols = we ? 7 : 5, t = today(), maxEv = 3;
  let h = `<div class="mv" style="--cols:${cols}" role="grid" aria-label="${esc(cap(MONTHS[mo]))} ${y}"><div role="row" style="display:contents">`;
  for (let i = 0; i < cols; i++) h += `<div class="mv-h${i === 6 ? ' red' : ''}" role="columnheader">${DAYS_SHORT[i]}</div>`;
  h += '</div>';
  for (let d = start; d <= end; d = addDays(d, 1)) {
    const wd = dow(d);
    if (!we && wd >= 5) continue;
    if (wd === 0) h += '<div role="row" style="display:contents">';
    const di = info(d), out = parse(d).getMonth() !== mo, evs = BY.get(d) || [];
    const red = !!di.hol || wd === 6;
    const cls = ['mc', out && 'out', (di.hol || di.brk || di.off != null) && 'off', d === S.selected && 'sel'].filter(Boolean).join(' ');
    const tags = dayTags(di).slice(0, 2);
    const shown = evs.length > maxEv ? evs.slice(0, maxEv - 1) : evs;
    h += `<div class="${cls}" data-date="${d}" role="gridcell">
      <div class="mc-top"><button type="button" class="mc-num${red ? ' red' : ''}${d === t ? ' today' : ''}" data-action="openday" data-date="${d}" aria-label="${esc(cap(fmtLong(d)))}${evs.length ? `, ${evs.length} ${plural(evs.length, 'spotkanie', 'spotkania', 'spotkań')}` : ''}">${parse(d).getDate()}</button>
      <div class="mc-tags">${tags.map(tg => `<span class="tag ${tg.k}" title="${esc(tg.t)}">${esc(tg.t)}</span>`).join('')}</div></div>
      <div class="mc-list">${shown.map(evChip).join('')}${evs.length > shown.length ? `<button type="button" class="mc-more" data-action="openday" data-date="${d}">+${evs.length - shown.length} więcej</button>` : ''}</div>
      <div class="mc-dots" aria-hidden="true">${evs.slice(0, 6).map(m => `<i style="--tc:var(--t-${TYPE_OF(m).k})"></i>`).join('')}</div>
    </div>`;
    if (wd === (we ? 6 : 4)) h += '</div>';
  }
  h += '</div>';
  const n = [...BY.entries()].filter(([d]) => d >= first && d <= last).reduce((a, [, arr]) => a + arr.length, 0);
  const foot = !S.loaded.meetings ? `${ic('sync')}Wczytywanie spotkań…`
    : n ? `${ic('info')}<span>Kliknij dzień, aby zobaczyć jego plan<span class="hide-sm">; dwuklik dodaje spotkanie</span>.</span>`
    : `${ic('info')}<span>Brak spotkań w tym miesiącu. Przycisk „+” dodaje spotkanie w wybranym dniu.</span>`;
  return h + `<div class="sheet-foot">${foot}</div>`;
}

function evBlock(m, top, hgt, L, detail) {
  const T = TYPE_OF(m), st = m.status;
  const w = 100 / L.n, left = L.col * w;
  const compact = hgt < 38, narrow = L.n > 1 && !detail;
  const lesson = narrow ? 0 : lessonNo(m);
  const who = whoLabel(m), title = titleOf(m);
  const main = who || title || T.short;
  const sec = who ? (title || T.short) : (title ? T.short : '');
  const badge = st === 'done' ? `<span class="st" title="Odbyte">${ic('check')}</span>`
    : st === 'absent' ? '<span class="st" title="Nieobecność ucznia">nb</span>'
    : st === 'cancel' ? '<span class="st" title="Odwołane">odw.</span>'
    : isTodo(m) ? '<span class="st todo" title="Do uzupełnienia: czy spotkanie się odbyło?">?</span>' : '';
  const tip = `${fmtTime(m.start)}–${fmtTime(m.end)} · ${T.label}${who ? ` · ${who}` : ''} · ${STATUS_LABEL[st]}`;
  return `<button type="button" draggable="true" class="ev s-${st}${compact ? ' compact' : ''}" data-action="edit" data-id="${esc(m.id)}" title="${esc(tip)}" style="--tc:var(--t-${T.k});top:${top}px;height:${hgt}px;left:calc(${left}% + 2px);width:calc(${w}% - 4px)">
    <span class="ev-t">${fmtTime(m.start)}${compact || narrow ? '' : `–${fmtTime(m.end)}`}${lesson && !compact ? ` <b>L${lesson}</b>` : ''}${compact ? '' : badge}</span>
    <span class="ev-l">${esc(main)}</span>${compact ? badge : ''}
    ${!compact && hgt >= 54 && sec ? `<span class="ev-s">${esc(sec)}</span>` : ''}
    ${detail && !S.discreet && m.note && hgt >= 80 ? `<span class="ev-n">${esc(m.note)}</span>` : ''}
  </button>`;
}

function renderTimeGrid(days, detail) {
  const st = S.settings, t = today();
  let from = toMin(st.dayFrom), to = toMin(st.dayTo);
  for (const d of days) {
    const wr=workRangeForDate(d);
    if(wr){ from=Math.min(from,toMin(wr[0])); to=Math.max(to,toMin(wr[1])); }
  }
  for (const d of days) for (const m of (BY.get(d) || [])) {
    from = Math.min(from, Math.floor(toMin(m.start) / 60) * 60);
    to = Math.max(to, Math.ceil(toMin(m.end) / 60) * 60);
  }
  to = Math.min(Math.max(to, from + 120), 24 * 60);
  const PX = detail ? 1.3 : 1.15, H = Math.round((to - from) * PX);
  let h = `<div class="wk-scroll"><div class="wk${detail ? ' wk1' : ''}" style="--days:${days.length}">`;
  h += '<div class="wk-row wk-head"><div class="wk-corner"></div>';
  for (const d of days) {
    const di = info(d), wd = dow(d), dd = parse(d);
    const wr=workRangeForDate(d);
    h += `<button type="button" class="wk-day${d === t ? ' today' : ''}${di.hol || wd === 6 ? ' red' : ''}${d === S.selected && !detail ? ' sel' : ''}" data-action="pickday" data-date="${d}" aria-label="${esc(cap(fmtLong(d)))}"><span class="wd">${DAYS_SHORT[wd]}</span><span class="dn">${dd.getDate()}</span>${detail ? `<span class="mn">${MONTHS_GEN[dd.getMonth()]}</span>` : ''}${wr ? `<span class="wk-worktime">${fmtTime(wr[0])}–${fmtTime(wr[1])}</span>` : ''}</button>`;
  }
  h += '</div><div class="wk-row wk-all"><div class="wk-corner"><span>dzień</span></div>';
  for (const d of days) h += `<div class="wk-allcell">${dayTags(info(d)).map(tg => `<span class="tag ${tg.k}" title="${esc(tg.t)}">${esc(tg.t)}</span>`).join('')}</div>`;
  h += `</div><div class="wk-row wk-body" style="height:${H}px" data-from="${from}" data-px="${PX}"><div class="wk-gutter" aria-hidden="true">`;
  for (let m = Math.ceil(from / 60) * 60; m < to; m += 60) if (m > from) h += `<span class="wk-hl" style="top:${((m - from) * PX).toFixed(1)}px">${m / 60}:00</span>`;
  st.bells.forEach(([a, b], i) => {
    const A = Math.max(toMin(a), from), B = Math.min(toMin(b), to);
    if (B - A >= 15) h += `<span class="wk-ln" style="top:${(((A + B) / 2 - from) * PX).toFixed(1)}px">${i + 1}</span>`;
  });
  h += '</div><div class="wk-grid" aria-hidden="true">';
  st.bells.forEach(([a, b]) => {
    const A = Math.max(toMin(a), from), B = Math.min(toMin(b), to);
    if (B > A) h += `<div class="wk-band" style="top:${((A - from) * PX).toFixed(1)}px;height:${((B - A) * PX).toFixed(1)}px"></div>`;
  });
  for (let m = Math.ceil(from / 60) * 60; m < to; m += 60) if (m > from) h += `<div class="wk-hour" style="top:${((m - from) * PX).toFixed(1)}px"></div>`;
  h += '</div>';
  days.forEach((d, ci) => {
    const di = info(d), off = !!(di.hol || di.brk || di.off != null);
    h += `<div class="wk-col${off ? ' off' : ''}${d === S.selected && !detail && days.length > 1 ? ' sel' : ''}" style="grid-column:${ci + 2}" data-date="${d}" title="Kliknij, aby dodać spotkanie">`;
    const wr=workRangeForDate(d);
    if(wr){
      const A=Math.max(toMin(wr[0]),from), B=Math.min(toMin(wr[1]),to);
      if(B>A) h += `<div class="work-window" style="top:${((A-from)*PX).toFixed(1)}px;height:${((B-A)*PX).toFixed(1)}px"><span>plan pracy</span></div>`;
    }
    const evs = (BY.get(d) || []).map(m => ({ ...m, s: toMin(m.start), e: Math.max(toMin(m.end), toMin(m.start) + 10) }));
    const lay = layoutDay(evs);
    for (const m of evs) {
      const L = lay.get(m.id) || { col: 0, n: 1 };
      h += evBlock(m, +((m.s - from) * PX).toFixed(1), Math.max(20, Math.round((m.e - m.s) * PX) - 2), L, detail);
    }
    if (d === t) { const n = nowMin(); if (n >= from && n <= to) h += `<div class="nowline" style="top:${((n - from) * PX).toFixed(1)}px"></div>`; }
    h += '</div>';
  });
  h += '</div></div></div>';
  return h;
}

async function setStatus(id, st) {
  const m = S.meetings.get(id);
  if (!m || pending.has(id)) return;
  const next = (m.status || 'plan') === st ? 'plan' : st;
  pending.add(id); render();
  try {
    const prev = m.status || 'plan';
    await store.updateMeeting(id, { status: next, updated: Date.now() });
    pushUndo('zmianę statusu', () => store.updateMeeting(id, { status: prev, updated: Date.now() }));
  }
  catch (e) { handleWriteError(e); }
  finally { pending.delete(id); render(); }
}

function conflicts() {

  return (BY.get(F.date) || []).filter(m => m.id !== F.id && m.status !== 'cancel' && toMin(m.start) < b && toMin(m.end) > a);
}
const seriesDates = () => genSeries(F.date, F.rep === 'custom' ? 7 * Math.max(1, +F.repWeeks || 1) : +F.rep, F.count, F.skip, d => !info(d).school);

function wireCombo() {
  const inp = $('#f-student', dlgM), list = $('#f-slist', dlgM);
  let items = [], act = -1;
  const close = () => { list.hidden = true; inp.setAttribute('aria-expanded', 'false'); inp.removeAttribute('aria-activedescendant'); act = -1; };
  function build() {
    const raw = inp.value.trim(), q = norm(raw);
    const all = [...S.students].filter(([, s]) => s && !s.archived && s.name).map(([id, s]) => ({ id, ...s }));
    let res = q ? all.filter(s => norm(`${s.name} ${s.cls || ''}`).includes(q)) : all;
    res = res.sort((a, b) => a.name.localeCompare(b.name, 'pl')).slice(0, 8);
    items = res.map(s => ({ kind: 's', id: s.id, label: s.name, cls: s.cls }));
    if (raw && !all.some(s => norm(s.name) === q)) items.push({ kind: 'new', label: raw });
    if (F.studentId) items.unshift({ kind: 'none', label: 'Bez ucznia' });
    if (!items.length) return close();
    act = Math.min(act, items.length - 1);
    list.innerHTML = items.map((it, i) => `<li role="option" id="f-opt-${i}" data-i="${i}" class="${it.kind}${i === act ? ' act' : ''}" aria-selected="${i === act}">${it.kind === 'new' ? `${ic('plus')}<span>Dodaj ucznia: <b>${esc(it.label)}</b></span>` : it.kind === 'none' ? `<span>${esc(it.label)}</span>` : `<span>${esc(S.discreet ? initials(it.label) : it.label)}</span>${it.cls ? `<em>${esc(it.cls)}</em>` : ''}`}</li>`).join('');
    list.hidden = false;
    inp.setAttribute('aria-expanded', 'true');
    if (act >= 0) inp.setAttribute('aria-activedescendant', `f-opt-${act}`); else inp.removeAttribute('aria-activedescendant');
  }
  function pick(i) {
    const it = items[i];
    if (!it) return;
    if (it.kind === 's') { F.studentId = it.id; F.newStudent = false; F.studentText = it.label; inp.value = it.label; }
    else if (it.kind === 'new') { F.studentId = ''; F.newStudent = true; F.studentText = it.label; }
    else { F.studentId = ''; F.newStudent = false; F.studentText = ''; inp.value = ''; }
    close(); refreshMeetingForm();
    if (it.kind === 'new') setTimeout(() => { const c = $('#f-newcls', dlgM); if (c) c.focus(); }, 0);
  }
  inp.addEventListener('input', () => { F.studentText = inp.value; F.studentId = ''; F.newStudent = false; act = -1; build(); refreshMeetingForm(); });
  inp.addEventListener('focus', () => { if (!F.studentId) build(); });
  inp.addEventListener('blur', () => setTimeout(close, 150));
  inp.addEventListener('keydown', e => {
    if (list.hidden) { if (e.key === 'ArrowDown') { e.preventDefault(); act = 0; build(); } return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); act = Math.min(items.length - 1, act + 1); build(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); act = Math.max(0, act - 1); build(); }
    else if (e.key === 'Enter' && act >= 0) { e.preventDefault(); pick(act); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); comboEsc = Date.now(); close(); }
  });
  list.addEventListener('mousedown', e => { e.preventDefault(); const li = e.target.closest('[data-i]'); if (li) pick(+li.dataset.i); });
}
let comboEsc = 0;

async function resolveStudent(f) {
  if (F.studentId && S.students.has(F.studentId)) return F.studentId;
  const text = String($('#f-student', f).value || '').trim();
  if (!text) return '';
  const ex = [...S.students].find(([, s]) => s && norm(s.name) === norm(text));
  if (ex) return ex[0];
  const id = newId('s'), now = Date.now();
  await store.setStudent(id, { name: text.slice(0, 120), cls: String(F.newCls || '').trim().slice(0, 20), note: '', archived: false, created: now, updated: now });
  return id;
}

function googleCalendarUrlFromF() {
  if (!DATE_RE.test(F.date) || !TIME_RE.test(F.start) || !TIME_RE.test(F.end)) return '';
  const compact = (d,t) => d.replaceAll('-','') + 'T' + t.replace(':','') + '00';
  const T = TYPE[F.type] || TYPE.kons;
  const stu = F.studentId ? S.students.get(F.studentId) : null;
  const safeTitle = stu && stu.cls ? `${T.short} · ${stu.cls}` : T.short;
  const p = new URLSearchParams({
    action:'TEMPLATE',
    text:safeTitle,
    dates:`${compact(F.date,F.start)}/${compact(F.date,F.end)}`,
    details:'Spotkanie szkolne',
    stz:'Europe/Warsaw',
    etz:'Europe/Warsaw'
  });
  if (F.rep !== 'none') {
    const interval = F.rep === 'custom' ? Math.max(1,+F.repWeeks||1) : (+F.rep / 7);
    p.set('recur', `RRULE:FREQ=WEEKLY;INTERVAL=${interval}`);
  }

async function saveMeeting() {
  const f = $('#mf', dlgM);
  F.date = $('#f-date', f).value; F.start = $('#f-start', f).value; F.end = $('#f-end', f).value;
  if (!DATE_RE.test(F.date) || !TIME_RE.test(F.start) || !TIME_RE.test(F.end)) return formWarn('Uzupełnij datę oraz godzinę początku i końca.');
  if (toMin(F.end) <= toMin(F.start)) return formWarn('Koniec spotkania musi być później niż początek.');
  if (F.type === 'staz' && !F.internshipTopic) return formWarn('Wybierz temat zajęć w ramach stażu.');
  const btn = $('#f-save', f), label = btn.textContent;
  btn.disabled = true;
  try {
    const studentId = await resolveStudent(f);
    const now = Date.now();
    const base = { date: F.date, start: F.start, end: F.end, type: F.type, studentId, title: F.title.trim().slice(0, 200), status: F.status, note: F.note.trim().slice(0, 4000), internshipRole: F.type === 'staz' ? F.internshipRole : '', internshipTopic: F.type === 'staz' ? F.internshipTopic : '', internshipReflection: F.type === 'staz' ? String(F.internshipReflection||'').trim().slice(0,2000) : '' };
    if (!F.id) {
      if (F.rep !== 'none') {
        const { dates } = seriesDates(), sid = newId('r');
        let done = 0;
        btn.textContent = `Zapisywanie 0/${dates.length}`;
        await runLimited(dates.map(d => () => store.setMeeting(newId('m'), { ...base, date: d, status: d === F.date ? F.status : 'plan', seriesId: sid, created: now, updated: now }).then(() => { done++; btn.textContent = `Zapisywanie ${done}/${dates.length}`; })), 4);
        toast(`Dodano ${dates.length} ${plural(dates.length, 'spotkanie', 'spotkania', 'spotkań')} w cyklu`);
      } else {
        await store.setMeeting(newId('m'), { ...base, seriesId: '', created: now, updated: now });
        toast('Dodano spotkanie');
      }
    } else {
      await store.updateMeeting(F.id, { ...base, updated: now });
      if (F.seriesId && F.scope === 'following') {
        const rest = (await store.queryMeetings('seriesId', F.seriesId)).filter(([id, m]) => id !== F.id && m && m.date > F.orig.date);
        const patch = { start: F.start, end: F.end, type: F.type, studentId, title: base.title, internshipRole: base.internshipRole, internshipTopic: base.internshipTopic, updated: now };
        await runLimited(rest.map(([id]) => () => store.updateMeeting(id, patch)), 4);
        toast(`Zapisano zmiany w ${rest.length + 1} ${plural(rest.length + 1, 'spotkaniu', 'spotkaniach', 'spotkaniach')}`);
      } else toast('Zapisano zmiany');
    }
    dlgM.close();
    ensureVisible(F.date);
    render();
  } catch (e) {
    handleWriteError(e);
    btn.disabled = false; btn.textContent = label;
  }
}

async function deleteMeeting(scope) {

    const deleted = [[F.id, {...F.orig}]];
    await store.deleteMeeting(F.id);

    if (scope === 'following') {
      const rest = (await store.queryMeetings('seriesId', F.seriesId)).filter(([id, m]) => id !== F.id && m && m.date > F.orig.date);

function studentStats() {
  const stats = new Map(), t = today();
  for (const m of allItems()) {
    if (!m.studentId || m.status === 'cancel') continue;
    const s = stats.get(m.studentId) || { n: 0, last: '', next: '' };
    s.n++;
    if (m.date <= t && m.date > s.last) s.last = m.date;
    if (m.date > t && (!s.next || m.date < s.next)) s.next = m.date;
    stats.set(m.studentId, s);
  }
  return stats;
}

dlgS.addEventListener('click', async e => {
  if (e.target === dlgS) return dlgS.close();
  const t = e.target;
  if (t.closest('[data-sclose]')) return dlgS.close();
  if (t.closest('[data-sback]')) return setStudentMode('list', null);
  if (t.closest('[data-snew]')) return setStudentMode('detail', null);
  const ar = t.closest('[data-sarch]');
  if (ar) { SD.arch = ar.dataset.sarch === '1'; $$('[data-sarch]', dlgS).forEach(b => b.setAttribute('aria-pressed', String(b === ar))); return updateStudentList(); }
  const op = t.closest('[data-sopen]');
  if (op) return setStudentMode('detail', op.dataset.sopen);
  const hop = t.closest('[data-hopen]');
  if (hop) {
    const m = SD.hist.get(hop.dataset.hopen);
    if (!m) return;
    dlgS.close();
    ensureVisible(m.date); render();
    return openMeeting({ id: hop.dataset.hopen, data: m });
  }
  if (t.closest('[data-smeet]')) { const id = SD.id; dlgS.close(); return openMeeting({ date: S.selected, studentId: id }); }
  if (t.closest('[data-sarchive]')) {
    const s = S.students.get(SD.id);
    if (!s) return;
    try { await store.updateStudent(SD.id, { archived: !s.archived, updated: Date.now() }); toast(s.archived ? 'Przywrócono z archiwum' : 'Przeniesiono do archiwum'); setStudentMode('list', null); }
    catch (err) { handleWriteError(err); }
    return;
  }
  if (t.closest('[data-sdel]')) {
    const foot = $('#s-foot', dlgS);
    foot.innerHTML = `<span class="confirm-q">Usunąć ucznia?</span><span class="hint">Spotkania zostaną, ale bez przypisanego ucznia.</span><span class="grow"></span><button type="button" class="btn ghost" data-sdelno>Nie usuwaj</button><button type="button" class="btn danger solid" data-sdelyes>Usuń ucznia</button>`;
    return;
  }
  if (t.closest('[data-sdelno]')) return setStudentMode('detail', SD.id);
  if (t.closest('[data-sdelyes]')) {
    try { await store.deleteStudent(SD.id); toast('Usunięto ucznia'); setStudentMode('list', null); }
    catch (err) { handleWriteError(err); }
  }
});

async function showWindowsNotification(title, body, tag='ks-notification') {
  if (!('Notification' in window) || Notification.permission !== 'granted') return false;
  try {
    if ('serviceWorker' in navigator) {
      const reg = await navigator.serviceWorker.getRegistration('./') || await navigator.serviceWorker.ready;
      if (reg && reg.showNotification) {
        await reg.showNotification(title, { body, tag, icon:'./icon.svg', badge:'./icon.svg' });
        return true;

    }
    new Notification(title, { body, tag, icon:'./icon.svg' });

  } catch (e) { console.warn('notification', e); return false; }
}
async function requestWindowsNotifications() {

}
async function changeVaultPasswordFromSettings() {
  const oldEl=$('#c-pass-old',dlgC), newEl=$('#c-pass-new',dlgC), repEl=$('#c-pass-new2',dlgC), st=$('#c-pass-status',dlgC);
  const oldPwd=oldEl.value, newPwd=newEl.value, rep=repEl.value;
  st.textContent='';
  if (newPwd.length < 8) { st.textContent='Nowe hasło musi mieć co najmniej 8 znaków.'; return; }
  if (newPwd !== rep) { st.textContent='Nowe hasła nie są identyczne.'; return; }
  try {
    const raw=localStorage.getItem(VAULT_KEY);
    const dec=await decryptVaultEnvelope(raw,oldPwd);
    const newSalt=crypto.getRandomValues(new Uint8Array(16));
    const newKey=await deriveVaultKey(newPwd,newSalt);
    localStorage.setItem(VAULT_KEY,await encryptVaultObject(dec.data,newKey,newSalt));
    vaultPassword=newPwd; vaultKey=newKey; vaultSalt=newSalt; vaultData=dec.data;
    disableWindowsHello();
    disableQuickPin();
    oldEl.value=''; newEl.value=''; repEl.value='';
    st.textContent='Hasło zostało zmienione. Windows Hello i szybki PIN zostały wyłączone. Możesz skonfigurować je ponownie.';
    toast('Zmieniono hasło szyfrowania');
  } catch(e) {
    console.warn(e);
    st.textContent='Bieżące hasło jest nieprawidłowe.';
  }
}

function readBells() {
  $$('#c-bells input[data-b]', dlgC).forEach(inp => { const i = +inp.dataset.b, k = +inp.dataset.k; if (CF.bells[i] && TIME_RE.test(inp.value)) CF.bells[i][k] = inp.value; });
}
dlgC.addEventListener('click', async e => {
  if (e.target === dlgC) return dlgC.close();
  const t = e.target;
  if (t.closest('[data-cclose]')) return dlgC.close();
  if (t.closest('[data-badd]')) {
    readBells();
    const last = CF.bells[CF.bells.length - 1];
    const s = last ? toMin(last[1]) + 10 : 8 * 60;
    if (s + 45 < 24 * 60) CF.bells.push([fromMin(s), fromMin(s + 45)]);
    $('#c-bells', dlgC).innerHTML = bellsHtml();
    return;
  }
  if (t.closest('[data-breset]')) { CF.bells = DEFAULT_BELLS.map(b => b.split('-')); $('#c-bells', dlgC).innerHTML = bellsHtml(); return; }
  if (t.closest('[data-work-reset]')) {
    CF.workHours=Object.fromEntries(Object.entries(DEFAULT_WORK_HOURS).map(([k,v])=>[k,v.slice()]));
    dlgC.innerHTML=settingsHtml();
    return;
  }
  const bd = t.closest('[data-bdel]');
  if (bd) { readBells(); CF.bells.splice(+bd.dataset.bdel, 1); $('#c-bells', dlgC).innerHTML = bellsHtml(); return; }
  if (t.closest('[data-oadd]')) {
    const d = $('#c-offd', dlgC).value, n = $('#c-offn', dlgC).value.trim();
    if (!DATE_RE.test(d)) { $('#c-offd', dlgC).focus(); return; }
    CF.offDays[d] = n || 'Dzień wolny od zajęć';
    $('#c-off', dlgC).innerHTML = offHtml();
    $('#c-offd', dlgC).value = ''; $('#c-offn', dlgC).value = '';
    return;
  }
  const od = t.closest('[data-odel]');
  if (od) { delete CF.offDays[od.dataset.odel]; $('#c-off', dlgC).innerHTML = offHtml(); return; }
  if (t.closest('[data-cexport]')) { dlgC.close(); openExport(); }
  if (t.closest('[data-check-update]')) { checkForUpdates(true); }
  if (t.closest('[data-pwa-install]')) {
    if (window.KSPWA && window.KSPWA.install) {
      const ok = await window.KSPWA.install();
      if (!ok) toast('W Brave wybierz Menu → Zainstaluj Kalendarz Specjalisty');
    } else toast('Otwórz tę stronę w Brave i wybierz instalację aplikacji');
    return;
  }
  if (t.closest('[data-pwa-install]')) { installPwa(); }
  if (t.closest('[data-notify-enable]')) {
    const perm=await requestWindowsNotifications();
    const st=$('#c-notify-status',dlgC);
    if (st) st.textContent=notificationStatusText();
    if (perm==='granted') {
      CF.notify=true;
      const cb=$('#c-notify',dlgC); if(cb) cb.checked=true;
      toast('Powiadomienia są włączone');
    }
    return;
  }
  if (t.closest('[data-notify-test]')) {
    if (!('Notification' in window) || Notification.permission!=='granted') {
      const perm=await requestWindowsNotifications();
      const st=$('#c-notify-status',dlgC); if(st) st.textContent=notificationStatusText();
      if (perm!=='granted') return toast('Brak zgody na powiadomienia','err');
    }
    const ok=await showWindowsNotification('Kalendarz Specjalisty','Test powiadomień Windows · bez danych ucznia','ks-test-'+Date.now());
    return toast(ok?'Wysłano test powiadomienia':'Nie udało się wysłać powiadomienia',ok?'':'err');
  }
  if (t.closest('[data-change-password]')) { await changeVaultPasswordFromSettings(); return; }
  if (t.closest('[data-pin-set]')) { await setQuickPinFromSettings(); return; }
  if (t.closest('[data-pin-disable]')) {
    disableQuickPin();
    toast('Usunięto PIN');
    dlgC.innerHTML=settingsHtml();
    return;
  }
  if (t.closest('[data-hello-enable]')) {
    const b=t.closest('[data-hello-enable]'), st=$('#c-hello-status',dlgC);
    b.disabled=true; if(st) st.textContent='Otwieram Windows Hello…';
    try {
      await enableWindowsHello();
      toast('Włączono Windows Hello');
      dlgC.innerHTML=settingsHtml();
    } catch(err) {
      console.warn(err);
      if(st) st.textContent='Nie udało się skonfigurować Windows Hello. Możesz nadal używać hasła.';
      b.disabled=false;
    }
    return;
  }
  if (t.closest('[data-hello-disable]')) {
    disableWindowsHello();
    toast('Wyłączono Windows Hello');
    dlgC.innerHTML=settingsHtml();
    return;
  }
});
dlgC.addEventListener('submit', async e => {
  e.preventDefault();
  readBells();
  const warn = $('#c-warn', dlgC);
  const fail = msg => { warn.hidden = false; warn.innerHTML = `<p>${ic('alert')}<span>${esc(msg)}</span></p>`; warn.scrollIntoView({ block: 'nearest' }); };
  if (!CF.bells.length) return fail('Dodaj co najmniej jedną lekcję.');
  const badBell = CF.bells.findIndex(([a, b]) => !TIME_RE.test(a) || !TIME_RE.test(b) || toMin(b) <= toMin(a));
  if (badBell >= 0) return fail(`Lekcja ${badBell + 1}: koniec musi być później niż początek.`);
  const work={};
  for(let i=0;i<5;i++){
    const a=$(`[data-work-day="${i}"][data-work-part="0"]`,dlgC)?.value||'';
    const b=$(`[data-work-day="${i}"][data-work-part="1"]`,dlgC)?.value||'';
    if(!TIME_RE.test(a)||!TIME_RE.test(b)||toMin(b)<=toMin(a)) return fail(`Plan pracy: popraw godziny dla dnia ${i+1}.`);
    work[i]=[a,b];
  }
  CF.workHours=work;
  CF.profile = {
    name:($('#c-profile-name',dlgC)?.value||DEFAULT_PROFILE.name).trim().slice(0,80) || DEFAULT_PROFILE.name,
    specialistRole:($('#c-profile-role',dlgC)?.value||DEFAULT_PROFILE.specialistRole).trim().slice(0,60) || DEFAULT_PROFILE.specialistRole,
    mentorName:($('#c-mentor-name',dlgC)?.value||'').trim().slice(0,100),
    mentorRole:($('#c-mentor-role',dlgC)?.value||DEFAULT_PROFILE.mentorRole).trim().slice(0,60) || DEFAULT_PROFILE.mentorRole
  };
  CF.region = $('#c-region', dlgC).value;
  CF.exams = $('#c-exams', dlgC).value;
  CF.observances = $('#c-obs', dlgC).checked;
  CF.dayFrom = $('#c-from', dlgC).value; CF.dayTo = $('#c-to', dlgC).value;
  if (!TIME_RE.test(CF.dayFrom) || !TIME_RE.test(CF.dayTo) || toMin(CF.dayTo) - toMin(CF.dayFrom) < 120) return fail('Widok dnia musi obejmować co najmniej dwie godziny.');
  CF.defaultLen = +$('#c-len', dlgC).value;
  CF.autoLock = +$('#c-lock', dlgC).value;
  CF.notify = $('#c-notify', dlgC).checked;
  CF.notifyBefore = +$('#c-notify-before', dlgC).value;
  CF.weekend = $('#c-we', dlgC).checked;
  const next = mergeSettings(serializeSettings(CF));
  S.settings = next;
  dlgC.close();
  render();
  try { await saveSettings(next); toast('Zapisano ustawienia'); } catch (err) { handleWriteError(err); }
});

function reportRange(scope) {
  if (scope === 'year') {
    const Y=schoolYearOf(S.cursor);
    return {from:`${Y}-09-01`,to:`${Y+1}-08-31`,label:`rok szkolny ${syLabel(Y)}`};
  }
  const c=parse(S.cursor), from=iso(new Date(c.getFullYear(),c.getMonth(),1,12)), to=iso(new Date(c.getFullYear(),c.getMonth()+1,0,12));
  return {from,to,label:`${MONTHS[c.getMonth()]} ${c.getFullYear()}`};
}
function buildReportText(scope) {
  const r=reportRange(scope);
  const items=allItems().filter(m=>m.date>=r.from && m.date<=r.to);
  const byStatus={plan:0,done:0,absent:0,cancel:0}, byType={};
  let mins=0;
  const students=new Set();
  for(const m of items){
    byStatus[m.status]=(byStatus[m.status]||0)+1;
    if(m.status==='done') mins+=Math.max(0,toMin(m.end)-toMin(m.start));
    if(m.status!=='cancel') byType[TYPE_OF(m).k]=(byType[TYPE_OF(m).k]||0)+1;
    if(m.studentId && m.status!=='cancel') students.add(m.studentId);
  }
  const active=items.length-byStatus.cancel;
  const lines=[
    `Podsumowanie pracy specjalisty szkolnego — ${r.label}`,
    `Łącznie spotkań (bez odwołanych): ${active}`,
    `Odbyte: ${byStatus.done}`,
    `Nieobecności: ${byStatus.absent}`,
    `Odwołane: ${byStatus.cancel}`,
    `Pozostające jako zaplanowane: ${byStatus.plan}`,
    `Czas odbytych spotkań: ${fmtHours(mins)} h`,
    `Liczba uczniów przypisanych do spotkań: ${students.size}`,
    '',
    'Rodzaje działań:'
  ];
  TYPES.forEach(T=>{ if(byType[T.k]) lines.push(`${T.label}: ${byType[T.k]}`); });
  return lines.join('\n');
}
function latestAutoBackupKey() {
  return Object.keys(localStorage).filter(k=>k.startsWith('psycal.auto.backup.')).sort().reverse()[0] || '';
}
function backupStatusHtml() {
  const last=+(localStorage.getItem('psycal.last.manual.backup')||0);
  const auto=latestAutoBackupKey();
  const manual=last ? new Date(last).toLocaleString('pl-PL') : 'jeszcze nie pobrano';
  const autoDate=auto ? auto.replace('psycal.auto.backup.','') : 'brak';
  return `Ostatnia pobrana kopia: <b>${esc(manual)}</b>. Najnowsza automatyczna kopia lokalna: <b>${esc(autoDate)}</b>.`;

async function verifyBackupFile(file) {
  const raw=await file.text();
  const env=JSON.parse(raw);
  if(!env || env.app!=='kalendarz-specjalisty-encrypted') throw new Error('format');
  let dec;
  try { dec=await decryptVaultEnvelope(env,vaultPassword); }
  catch {
    const pwd=prompt('Kopia ma inne hasło. Podaj hasło użyte do jej utworzenia:');
    if(!pwd) throw new Error('cancelled');
    dec=await decryptVaultEnvelope(env,pwd);
  }
  const meetings=Object.keys((dec.data&&dec.data.meetings)||{}).length;
  const students=Object.keys((dec.data&&dec.data.students)||{}).length;
  return {meetings,students};
}
function overtimeTargetStudent() {
  const cfg=S.settings.overtime||DEFAULTS.overtime;
  if(cfg.studentId && S.students.has(cfg.studentId)) return {id:cfg.studentId,...S.students.get(cfg.studentId)};
  return null;
}
function overtimeRows(scope) {
  const target=overtimeTargetStudent(), cfg=S.settings.overtime||DEFAULTS.overtime;
  if(!target) return {target:null,rows:[],total:null,cfg};
  const r=reportRange(scope), endDate=cfg.endDate||r.to, to=endDate<r.to?endDate:r.to;
  const list=allItems().filter(m =>
    m.studentId===target.id &&
    normalizeTypeKey(m.type)==='rewal' &&
    m.date>=r.from && m.date<=to &&
    info(m.date).school
  );
  const weeks=new Map();
  for(const m of list){
    const mon=mondayOf(m.date);
    if(!weeks.has(mon)) weeks.set(mon,{mon,from:mon,to:addDays(mon,4),plan:0,done:0,absent:0,cancel:0,minutes:0});
    const w=weeks.get(mon);
    w[m.status]=(w[m.status]||0)+1;
    if(m.status==='done') w.minutes+=Math.max(0,toMin(m.end)-toMin(m.start));
  }
  const rows=[...weeks.values()].sort((a,b)=>a.mon.localeCompare(b.mon)).map(w=>({...w,toTable:w.done+(cfg.countAbsent?w.absent:0)}));
  const total=rows.reduce((a,w)=>({
    plan:a.plan+w.plan,done:a.done+w.done,absent:a.absent+w.absent,cancel:a.cancel+w.cancel,minutes:a.minutes+w.minutes,toTable:a.toTable+w.toTable
  }),{plan:0,done:0,absent:0,cancel:0,minutes:0,toTable:0});
  return {target,rows,total,cfg};
}

function overtimeClipboard(scope) {
  const o=overtimeRows(scope);
  if(!o.target || !o.rows.length) return '';
  const lines=['Tydzień\tPlan\tOdbyte\tNB\tOdwołane\tDo tabelki\tMinuty odbytych'];

function buildAnonCsv(scope) {
  const r=reportRange(scope), rows={};
  for(const m of allItems().filter(m=>m.date>=r.from&&m.date<=r.to)){
    const k=TYPE_OF(m).k;
    if(!rows[k]) rows[k]={label:TYPE_OF(m).label,plan:0,done:0,absent:0,cancel:0,minutes:0};
    rows[k][m.status]=(rows[k][m.status]||0)+1;
    if(m.status==='done') rows[k].minutes+=Math.max(0,toMin(m.end)-toMin(m.start));
  }
  const head=['Rodzaj','Zaplanowane','Odbyte','NB','Odwołane','Minuty odbytych'];
  const body=Object.values(rows).map(x=>[x.label,x.plan,x.done,x.absent,x.cancel,x.minutes].map(csvCell).join(';'));
  return {name:`zestawienie_bez_danych_${scope==='year'?syLabel(schoolYearOf(S.cursor)).replace('/','-'):r.from.slice(0,7)}.csv`,text:'﻿'+[head.join(';'),...body].join('\r\n'),n:body.length};
}

async function promoteStudentClasses() {
  if(!confirm('Podnieść klasy uczniów o jeden poziom? Uczniowie klas 5 zostaną oznaczeni jako archiwalni. Operację będzie można cofnąć przyciskiem Cofnij.')) return;
  const changed=[];
  const tasks=[];
  for(const [id,st] of S.students){
    if(!st||st.archived) continue;
    const cls=String(st.cls||'');
    const m=/^\s*([1-5])(.*)$/.exec(cls);
    if(!m) continue;
    const before={...st};
    const patch=+m[1]>=5 ? {archived:true,updated:Date.now()} : {cls:String(+m[1]+1)+m[2],updated:Date.now()};
    changed.push([id,before]);
    tasks.push(()=>store.updateStudent(id,patch));
  }
  await runLimited(tasks,4);
  if(changed.length) pushUndo('podniesienie klas',()=>runLimited(changed.map(([id,st])=>()=>store.setStudent(id,st)),4));
  toast(changed.length?`Zaktualizowano ${changed.length} uczniów`:'Nie znaleziono klas do zmiany');
}

function buildCsv(scope, withNotes) {
  let from, to;
  if (scope === 'year') { const Y = schoolYearOf(S.cursor); from = `${Y}-09-01`; to = `${Y + 1}-08-31`; }
  else { const c = parse(S.cursor); from = iso(new Date(c.getFullYear(), c.getMonth(), 1, 12)); to = iso(new Date(c.getFullYear(), c.getMonth() + 1, 0, 12)); }
  const items = allItems().filter(m => m.date >= from && m.date <= to).sort((a, b) => a.date.localeCompare(b.date) || a.start.localeCompare(b.start));
  const head = ['Data', 'Dzień', 'Od', 'Do', 'Lekcja', 'Rodzaj', 'Uczeń', 'Klasa', 'Temat', 'Status', 'Minuty', 'Staż – prowadzi/obserwuje', 'Staż – wnioski'];
  if (withNotes) head.push('Notatka');
  const rows = items.map(m => {
    const st = studentOf(m), l = lessonNo(m);
    const r = [m.date, DAYS[dow(m.date)], m.start, m.end, l || '', TYPE_OF(m).label, st ? st.name : '', st ? st.cls || '' : '', m.title || '', STATUS_LABEL[m.status], Math.max(0, toMin(m.end) - toMin(m.start)), normalizeTypeKey(m.type)==='staz' ? internshipRoleLabel(m.internshipRole) : '', normalizeTypeKey(m.type)==='staz' ? (m.internshipReflection||'') : ''];
    if (withNotes) r.push(m.note || '');
    return r.map(csvCell).join(';');
  });
  const name = scope === 'year' ? `spotkania_${syLabel(schoolYearOf(S.cursor)).replace('/', '-')}.csv` : `spotkania_${from.slice(0, 7)}.csv`;
  return { name, text: '﻿' + [head.join(';'), ...rows].join('\r\n'), n: items.length };
}
async function offerFile(filename, text) {
  const blob = new Blob([text], { type: filename.endsWith('.csv') ? 'text/csv;charset=utf-8' : 'application/octet-stream' });

function splitCsvLine(line, sep) {
  const out=[]; let cur='', q=false;
  for (let i=0;i<line.length;i++) {
    const c=line[i];
    if (c === '"') { if (q && line[i+1] === '"') { cur+='"'; i++; } else q=!q; }
    else if (c===sep && !q) { out.push(cur); cur=''; }
    else cur+=c;
  }
  out.push(cur); return out.map(x=>x.trim());
}
function detectSep(line) { return (line.split(';').length >= line.split(',').length) ? ';' : ','; }
function mapOldType(v) {
  const x=norm(v);
  if (x.includes('rewalid')) return 'rewal';
  if (x.includes('terap')) return 'terap';
  if (x.includes('rodz')) return 'rodz';
  if (x.includes('naucz')) return 'naucz';
  if (x.includes('instyt')) return 'inst';
  if (x.includes('warszt')||x.includes('szkolen')||x.includes('grup')) return 'warszt';
  if (x.includes('konfer')||x.includes('zesp')||x.includes('rada')) return 'konf';
  if (x.includes('staz')||x.includes('mentor')) return 'staz';
  return 'kons';
}
function mapOldStatus(v) {
  const x=norm(v);
  if (x.includes('odbyte')||x==='done') return 'done';
  if (x.includes('nieobec')||x==='absent') return 'absent';
  if (x.includes('odwol')||x==='cancel') return 'cancel';
  return 'plan';
}
function convertOldEvents(events) {
  const students = new Map(), meetings=[];
  const now=Date.now();
  const studentIdFor = (name, cls) => {
    const n=String(name||'').trim(), c=String(cls||'').trim();
    if (!n) return '';
    const key=norm(n)+'|'+norm(c);
    if (!students.has(key)) students.set(key, ['s_'+Math.random().toString(36).slice(2,10), {name:n.slice(0,120),cls:c.slice(0,20),note:'',archived:false,created:now,updated:now}]);
    return students.get(key)[0];
  };
  for (const e of events) {
    const date=String(e.date||e.Data||'').slice(0,10);
    const start=String(e.time||e.start||e.Od||'').slice(0,5);
    if (!DATE_RE.test(date)||!TIME_RE.test(start)) continue;
    const dur=Math.max(5,Math.min(600,+e.duration||+e.Minuty||45));
    const end=e.end&&TIME_RE.test(String(e.end).slice(0,5)) ? String(e.end).slice(0,5) : fromMin(Math.min(1435,toMin(start)+dur));
    const name=e.title||e.student||e['Uczeń']||e['Uczen']||'';
    const cls=e.className||e.cls||e.Klasa||'';
    const sid=studentIdFor(name,cls);
    meetings.push([ID_RE.test(String(e.id||''))?String(e.id):newId('m'), {
      date,start,end,type:mapOldType(e.type||e.Rodzaj||''),studentId:sid,
      title:cleanStr(e.topic||e.Temat||'',200),status:mapOldStatus(e.status||e.Status||''),
      note:cleanStr(e.notes||e.Notatka||'',4000),seriesId:'',created:now,updated:now
    }]);
  }
  return {students:[...students.values()],meetings};
}
function parseLegacyCsv(text) {
  const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());
  if (lines.length<2) throw new Error('csv');
  const sep=detectSep(lines[0]), head=splitCsvLine(lines[0],sep);
  const rows=lines.slice(1).map(l=>splitCsvLine(l,sep));
  return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]||''])));
}
function readLegacyImport(file) {
  const box=$('#e-legacy-result',dlgE);
  const r=new FileReader();
  r.onload=()=>{
    try{
      let converted;
      if (file.name.toLowerCase().endsWith('.csv')) converted=convertOldEvents(parseLegacyCsv(r.result));
      else {
        const o=JSON.parse(r.result);
        if (Array.isArray(o.events)) converted=convertOldEvents(o.events);
        else if (Array.isArray(o)) converted=convertOldEvents(o);
        else if (o && typeof o.meetings==='object') {
          const students=Object.entries(o.students||{});
          const meetings=Object.entries(o.meetings||{});
          converted={students,meetings};
        } else throw new Error('format');
      }
      importData={meetings:converted.meetings,students:converted.students,settings:null};

  let changed=false;
  for(const m of (BY.get(d)||[])){
    if(m.status!=='plan') continue;
    const diff=toMin(m.start)-now;
    if(diff<0 || diff>before) continue;
    const sig=`${m.id}|${m.start}|${before}`;
    if(done.has(sig)) continue;
    const st=studentOf(m);
    const body=`${TYPE_OF(m).short}${st&&st.cls ? ' · '+st.cls : ''} · ${fmtTime(m.start)}–${fmtTime(m.end)}`;
    const title=diff<=1 ? 'Spotkanie teraz' : `Spotkanie za ${diff} min`;
    if(await showWindowsNotification(title,body,'ks-'+m.id+'-'+m.start.replace(':',''))){
      done.add(sig); changed=true;
    }
  }
  if(changed) localStorage.setItem(key,JSON.stringify([...done].slice(-100)));
  Object.keys(localStorage).filter(k=>k.startsWith('psycal.notified.') && k!==key).forEach(k=>localStorage.removeItem(k));
}

function startTicker() {
  let last = today(), tick = 0;
  setInterval(() => {
    tick++;
    const t = today();
    if (t !== last) { last = t; render(); return; }
    const n = nowMin();
    $$('.nowline').forEach(el => { const b = el.closest('.wk-body'); el.style.top = `${((n - +b.dataset.from) * +b.dataset.px).toFixed(1)}px`; });
    checkMeetingNotifications();
    if (tick % 5 === 0 && !document.querySelector('dialog[open]')) renderSide();
  }, 60000);
}

// ── start ──
document.documentElement.lang = 'pl';
$$('[data-i]').forEach(el => { el.insertAdjacentHTML('afterbegin', ic(el.dataset.i)); });


let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const b = $('#c-pwa-install', dlgC);
  if (b) { b.disabled = false; b.textContent = 'Zainstaluj w Brave'; }
});
window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  toast('Kalendarz został zainstalowany jako aplikacja');
});

async function installPwa() {
  const status = $('#c-update-status', dlgC);
  if (window.matchMedia('(display-mode: standalone)').matches) {
    if (status) status.textContent = 'Aplikacja jest już zainstalowana.';
    return;
  }
  if (!deferredInstallPrompt) {
    if (status) status.textContent = 'W Brave wybierz Menu → Zapisz i udostępnij → Zainstaluj Kalendarz Specjalisty.';
    return;
  }
  deferredInstallPrompt.prompt();
  try { await deferredInstallPrompt.userChoice; } catch {}
  deferredInstallPrompt = null;
}

async function autoBackupEncrypted() {
  try {
    const raw = localStorage.getItem(VAULT_KEY);
    if (!raw) return;
    const day = today();
    if (localStorage.getItem('psycal.last.auto.backup') === day) return;
    localStorage.setItem('psycal.auto.backup.' + day, raw);
    localStorage.setItem('psycal.last.auto.backup', day);
    const keys = Object.keys(localStorage).filter(k => k.startsWith('psycal.auto.backup.')).sort().reverse();
    keys.slice(7).forEach(k => localStorage.removeItem(k));
  } catch (e) { console.warn('auto backup', e); }
}

async function registerPwa() {
  if (!('serviceWorker' in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' });
    await reg.update().catch(() => {});
  } catch (e) { console.warn('service worker', e); }
}

async function checkForUpdates(manual = false) {
  const status = $('#c-update-status', dlgC);
  if (status) status.textContent = 'Sprawdzam…';
  try {
    if ('serviceWorker' in navigator) {
      const reg = await navigator.serviceWorker.getRegistration('./');
      if (reg) await reg.update();
    }
    await fetch('./index.html?update=' + Date.now(), { cache: 'no-store' });
    if (status) status.textContent = 'Najnowsza wersja jest dostępna.';
    if (manual) setTimeout(() => location.reload(), 400);
  } catch (e) {
    if (status) status.textContent = 'Brak połączenia. Aplikacja nadal działa offline.';
    if (manual) toast('Brak połączenia. Działa wersja offline.');
  }
}

async function init() {
  render();
  startTicker();
  const data = await unlockOrCreateVault();
  store = makeLocalStore(data);
  S.mode = 'local';
  store.watchSettings(d => { S.settings = mergeSettings(d); S.loaded.settings = true; render(); }, onDbError);
  store.watchStudents(map => { S.students = map; S.loaded.students = true; render(); if (dlgS.open) refreshStudentsDialog(); }, onDbError);
  ensureWindow();
  render();
  setTimeout(autoBackupEncrypted, 1200);
  setTimeout(registerPwa, 300);
  setTimeout(() => checkForUpdates(false), 1800);
  setTimeout(checkMeetingNotifications, 2400);
  setTimeout(() => { if (!document.querySelector('dialog[open]')) openTodayDashboard(); }, 700);
}
init();
})();
