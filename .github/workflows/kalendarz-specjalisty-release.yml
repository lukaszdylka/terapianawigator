name: Kalendarz Specjalisty - build and release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalendarz-specjalisty-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Choose version
        shell: pwsh
        run: |
          $version = 1000 + ([int]$env:GITHUB_RUN_NUMBER * 10) + [int]$env:GITHUB_RUN_ATTEMPT
          "KS_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "KS_TAG=kalendarz-v$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Embed build version
        shell: pwsh
        working-directory: kalendarz-specjalisty
        run: |
          $p = "main.go"
          $s = Get-Content $p -Raw
          $s = $s -replace 'const appVersion = \d+', "const appVersion = $env:KS_VERSION"
          Set-Content -Path $p -Value $s -Encoding UTF8

      - name: Build Windows EXE
        shell: pwsh
        working-directory: kalendarz-specjalisty
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o KalendarzSpecjalisty.exe .

      - name: Calculate SHA256
        id: hash
        shell: pwsh
        working-directory: kalendarz-specjalisty
        run: |
          $sha = (Get-FileHash -Algorithm SHA256 KalendarzSpecjalisty.exe).Hash.ToLower()
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: kalendarz-specjalisty
        run: |
          gh release create "$env:KS_TAG" "KalendarzSpecjalisty.exe" --repo "$env:GITHUB_REPOSITORY" --title "Kalendarz Specjalisty $env:KS_VERSION" --notes "Automatyczny build Kalendarza Specjalisty."

      - name: Update manifest
        shell: pwsh
        working-directory: kalendarz-specjalisty
        run: |
          $asset = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:KS_TAG/KalendarzSpecjalisty.exe"
          $manifest = [ordered]@{
            version = [int]$env:KS_VERSION
            label = "$env:KS_VERSION"
            url = $asset
            sha256 = "${{ steps.hash.outputs.sha }}"
          } | ConvertTo-Json
          Set-Content -Path update.json -Value $manifest -Encoding UTF8

      - name: Commit update manifest
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- kalendarz-specjalisty/main.go
          git add kalendarz-specjalisty/update.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "Update Kalendarz Specjalisty manifest [skip ci]"
            git push origin main
          }
